<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Electoral - Iztacalco</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; background: #f8f9fa; }
    #map { height: 100vh; width: 100%; }
    
    /* Panel de Control Flotante Inferior */
    .panel-flotante {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; gap: 8px; background: rgba(255,255,255,0.95);
      padding: 8px 12px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      max-width: 95%; width: max-content; overflow-x: auto;
    }

    .btn-action {
      border: none; padding: 10px 14px; border-radius: 20px; font-weight: bold;
      font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    
    .btn-gps { background: #007bff; color: white; }
    .btn-registro-gps { background: #28a745; color: white; display: none; } /* Oculto hasta tener GPS */
    .btn-tabla { background: #343a40; color: white; }

    .btn-registrar-popup {
      background: #28a745; color: white; border: none; padding: 8px 12px;
      border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer;
      margin-top: 6px; width: 100%; text-align: center; display: block;
    }
    
    /* Modales */
    .modal {
      display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6); justify-content: center; align-items: flex-end;
    }
    .modal-content {
      background: white; width: 100%; max-width: 750px; max-height: 88vh; overflow-y: auto;
      padding: 20px; border-radius: 16px 16px 0 0; box-sizing: border-box; animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #333; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px;
    }

    .btn-submit { background: #28a745; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
    .btn-close { background: #6c757d; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; margin-top: 8px; font-weight: bold; cursor: pointer; }
    .btn-ocr { background: #17a2b8; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 4px; cursor: pointer; }

    #preview-container { display: none; margin-top: 8px; text-align: center; }
    #preview-img { max-width: 100%; max-height: 150px; border-radius: 8px; border: 1px solid #ddd; }

    .etiqueta-seccion {
      background: rgba(255, 255, 255, 0.75) !important;
      border: 1px solid rgba(0, 0, 0, 0.4) !important;
      border-radius: 3px !important;
      font-weight: 600 !important;
      font-size: 9px !important;
      color: #222 !important;
      padding: 0px 3px !important;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Barra Flotante Inferior -->
  <div class="panel-flotante">
    <button class="btn-action btn-gps" onclick="centrarGPS()">📍 Mi Ubicación</button>
    <button id="btnRegistroDirectoGPS" class="btn-action btn-registro-gps" onclick="registrarEnMiUbicacionActual()">🏠 Registrar en mi ubicación actual</button>
    <button class="btn-action btn-tabla" onclick="abrirModalTabla()">📊 Ver Registros</button>
  </div>

  <!-- Modal Captura Completa -->
  <div id="modalForm" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Registrar Visita de Casa</h3>
      
      <div class="form-group">
        <label>Nombre del Brigadista *</label>
        <input type="text" id="brigadista" placeholder="Nombre de quien visita">
      </div>

      <div class="form-group">
        <label>Nombre del Ciudadano / Contacto</label>
        <input type="text" id="nombre_persona" placeholder="Nombre completo">
      </div>

      <div class="form-group">
        <label>Teléfono (10 dígitos)</label>
        <input type="tel" id="telefono" maxlength="10" placeholder="Ej: 5512345678">
      </div>

      <div class="form-group">
        <label>¿Es Simpatizante?</label>
        <select id="simpatizante">
          <option value="true">Sí (Simpatizante)</option>
          <option value="false">No / Indeciso</option>
        </select>
      </div>

      <div class="form-group">
        <label>¿Entregó copia / foto de INE?</label>
        <select id="entrego_ine">
          <option value="false">No</option>
          <option value="true">Sí</option>
        </select>
      </div>

      <div class="form-group">
        <label>¿Registro en Plataforma?</label>
        <select id="registro_plataforma">
          <option value="true">Sí</option>
          <option value="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fotografía de INE (Opcional)</label>
        <input type="file" id="foto_ine" accept="image/*" capture="environment" onchange="procesarFoto(event)">
        <button type="button" class="btn-ocr" onclick="extraerTextoOCR()">🔍 Escanear texto de INE (OCR)</button>
        <div id="preview-container">
          <img id="preview-img" src="" alt="Vista previa">
        </div>
      </div>

      <div class="form-group">
        <label>Dirección / Referencia de Casa</label>
        <input type="text" id="direccion" placeholder="Calle, número exterior/interior">
      </div>

      <div class="form-group">
        <label>Observaciones</label>
        <textarea id="observaciones" rows="2" placeholder="Notas de la visita"></textarea>
      </div>

      <input type="hidden" id="lat">
      <input type="hidden" id="lng">

      <button class="btn-submit" onclick="guardarRegistro()">Guardar Casa</button>
      <button class="btn-close" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yaewqbjqcmkfqhupyebg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_iG_U5IfGmBx0_pWBancEjw_UkJJERlc'; 
    
    let _supabase = null;
    try {
      if (window.supabase) _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) { console.warn(e); }

    let gpsMarker = null;
    let gpsLat = null;
    let gpsLng = null;
    let clickMarker = null;

    // Inicializar Mapa
    const map = L.map('map').setView([19.395, -99.095], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    // Centrar y Obtener Ubicación
    function centrarGPS() {
      alert("Obteniendo tu posición GPS... Por favor permite el acceso a tu ubicación.");
      map.locate({ setView: true, maxZoom: 18, enableHighAccuracy: true });
    }

    // Evento de ubicación encontrada
    map.on('locationfound', function(e) {
      gpsLat = e.latlng.lat;
      gpsLng = e.latlng.lng;

      if (gpsMarker) map.removeLayer(gpsMarker);

      // Mostrar el botón verde en la barra inferior
      document.getElementById('btnRegistroDirectoGPS').style.display = 'flex';

      const contenidoPopup = `
        <div style="text-align:center; padding: 4px;">
          <b>📍 ¡Estás aquí!</b><br>
          <span style="font-size:11px; color:#666;">Coordenadas fijadas con precisión</span><br>
          <button class="btn-registrar-popup" onclick="abrirModalConCoordenadas(${gpsLat}, ${gpsLng})">
            ➕ Registrar en mi ubicación
          </button>
        </div>
      `;

      gpsMarker = L.marker(e.latlng).addTo(map).bindPopup(contenidoPopup);
      gpsMarker.openPopup(); // Abre el cuadro emergente automáticamente
    });

    map.on('locationerror', function() {
      alert("No se pudo obtener la ubicación GPS. Verifica que la ubicación esté activada en tu teléfono.");
    });

    function registrarEnMiUbicacionActual() {
      if (gpsLat && gpsLng) {
        abrirModalConCoordenadas(gpsLat, gpsLng);
      } else {
        alert("Primero presiona '📍 Mi Ubicación' para detectar tus coordenadas.");
      }
    }

    function abrirModalConCoordenadas(lat, lng) {
      document.getElementById('lat').value = lat;
      document.getElementById('lng').value = lng;

      if (clickMarker) map.removeLayer(clickMarker);
      clickMarker = L.marker([lat, lng]).addTo(map);

      document.getElementById('modalForm').style.display = 'flex';
    }

    map.on('click', function(e) {
      abrirModalConCoordenadas(e.latlng.lat, e.latlng.lng);
    });

    function cerrarModal() {
      document.getElementById('modalForm').style.display = 'none';
      if (clickMarker) map.removeLayer(clickMarker);
    }
  </script>
</body>
</html>
