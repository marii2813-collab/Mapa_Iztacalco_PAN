<script>
    // 1. Configuración de Supabase
    const SUPABASE_URL = 'https://yaewqbjqcmkfqhupyebg.supabase.co';
    const SUPABASE_KEY = 'TU_CLAVE_SB_PUBLISHABLE_AQUI'; // PEGA AQUÍ TU CLAVE COMPLETA DE SUPABASE
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Inicializar Mapa
    const map = L.map('map').setView([19.395, -99.095], 14);

    // Capa base de OpenStreetMap
    const mapaBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Grupos de capas para encender/apagar
    const capaSecciones = L.layerGroup().addTo(map);
    const capaCasas = L.layerGroup().addTo(map);

    // 3. Control de Capas (Prender / Apagar)
    const capasSuperpuestas = {
      "🗺️ Polígonos de Rutas y Secciones": capaSecciones,
      "📍 Casas Registradas": capaCasas
    };
    L.control.layers(null, capasSuperpuestas, { collapsed: false }).addTo(map);

    // 4. Cargar Polígonos de Rutas y Secciones desde el GeoJSON
    fetch('rutas_iztacalco_completo.geojson')
      .then(res => res.json())
      .then(data => {
        const geojsonLayer = L.geoJSON(data, {
          style: {
            color: '#ff7800',
            weight: 2,
            opacity: 0.7,
            fillOpacity: 0.15
          },
          onEachFeature: function (feature, layer) {
            let info = `<b>Sección:</b> ${feature.properties.seccion || feature.properties.SECCION || 'N/A'}<br>`;
            if (feature.properties.ruta) info += `<b>Ruta:</b> ${feature.properties.ruta}`;
            layer.bindPopup(info);
          }
        });
        capaSecciones.addLayer(geojsonLayer);
      })
      .catch(err => console.error("Error al cargar el GeoJSON:", err));

    // 5. Captura al hacer clic en el Mapa
    let clickMarker;
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      document.getElementById('lat').value = lat;
      document.getElementById('lng').value = lng;

      if (clickMarker) map.removeLayer(clickMarker);
      clickMarker = L.marker([lat, lng]).addTo(map);

      document.getElementById('modalForm').style.display = 'flex';
    });

    function cerrarModal() {
      document.getElementById('modalForm').style.display = 'none';
      if (clickMarker) map.removeLayer(clickMarker);
    }

    // 6. Guardar Registro en Supabase
    async function guardarRegistro() {
      const brigadista = document.getElementById('brigadista').value;
      const simpatizante = document.getElementById('simpatizante').value === 'true';
      const direccion = document.getElementById('direccion').value;
      const observaciones = document.getElementById('observaciones').value;
      const lat = parseFloat(document.getElementById('lat').value);
      const lng = parseFloat(document.getElementById('lng').value);

      if (!brigadista) {
        alert("Por favor ingresa el nombre del brigadista.");
        return;
      }

      const { data, error } = await _supabase
        .from('simpatizantes')
        .insert([
          { brigadista_nombre: brigadista, es_simpatizante: simpatizante, direccion: direccion, observaciones: observaciones, lat: lat, lng: lng }
        ]);

      if (error) {
        alert("Error al guardar: " + error.message);
      } else {
        alert("¡Casa registrada con éxito!");
        cerrarModal();
        cargarCasasGuardadas();
      }
    }

    // 7. Cargar Puntos Capturados en la Capa de Casas
    async function cargarCasasGuardadas() {
      capaCasas.clearLayers(); // Limpiar capas previas para no duplicar
      const { data, error } = await _supabase.from('simpatizantes').select('*');
      if (!error && data) {
        data.forEach(casa => {
          const colorIcono = casa.es_simpatizante ? '#28a745' : '#ffc107';
          const marcador = L.circleMarker([casa.lat, casa.lng], {
            radius: 8,
            fillColor: colorIcono,
            color: '#000',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.85
          }).bindPopup(`<b>Brigadista:</b> ${casa.brigadista_nombre}<br><b>Simpatizante:</b> ${casa.es_simpatizante ? 'Sí' : 'No'}<br><b>Dirección:</b> ${casa.direccion || 'S/N'}`);

          capaCasas.addLayer(marcador);
        });
      }
    }
    cargarCasasGuardadas();

    // 8. Geolocalización del Teléfono
    function centrarGPS() {
      map.locate({setView: true, maxZoom: 18});
    }
    map.on('locationfound', function(e) {
      L.circle(e.latlng, e.accuracy / 2).addTo(map);
      L.marker(e.latlng).addTo(map).bindPopup("¡Estás aquí! Toca en la casa para registrar.").openPopup();
    });
    map.on('locationerror', function() {
      alert("No se pudo obtener la ubicación GPS de tu dispositivo.");
    });
  </script>
